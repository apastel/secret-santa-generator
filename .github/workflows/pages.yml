name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Ensure Pages source exists
        run: |
          mkdir -p docs
          if [ ! -f docs/index.html ]; then
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en"><head><meta charset="utf-8"><title>Secret Santa</title></head>' \
              '<body><main><h1>Secret Santa</h1><p>Personal assignments are shared through individual links.</p></main></body></html>' \
              > docs/index.html
          fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4