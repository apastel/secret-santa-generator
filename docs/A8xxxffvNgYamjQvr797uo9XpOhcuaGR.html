<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Secret Santa</title>
  <style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8ed;color:#20302a}main{box-sizing:border-box;width:min(100%,42rem);padding:2.5rem 1.5rem;text-align:center}h1{font-size:2rem;margin:0 0 1.5rem}.assignment-line{margin:0 0 1.5rem;font-size:1.25rem;line-height:1.7}.reveal-target{position:relative;display:inline-grid;vertical-align:middle}#recipient,#reveal-button{grid-area:1/1}#recipient{filter:blur(8px);user-select:none;white-space:nowrap}#reveal-button{z-index:1;align-self:stretch;justify-self:stretch;padding:.45rem .8rem;border:1px solid #536b5d;border-radius:6px;background:#fffdf8;color:#20302a;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}#reveal-button:focus-visible{outline:3px solid #d58c22;outline-offset:3px}#santa-image{display:block;width:100%;height:auto;margin:0 auto}</style>
</head>
<body><main>
  <h1>Hello Laura!</h1>
  <p class="assignment-line">You will be getting a present for     <span class="reveal-target"><span id="recipient">hidden</span><button id="reveal-button" type="button">Tap to reveal</button></span>!</p>
  <img id="santa-image" src="secret-santa.png" alt="Secret Santa illustration">
</main>
<script>
const nonce = "qHjTaNFLJzBwS43h";
const ciphertext = "E_rNpjQZmEaRH-3v5wwE7yqM0ec";
function decode(value) {
  const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(base64 + "=".repeat((4 - base64.length % 4) % 4)), c => c.charCodeAt(0));
}
async function showAssignment() {
  try {
    const keyBytes = decode(window.location.hash.slice(1));
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    const cleartext = await crypto.subtle.decrypt(
      {name: "AES-GCM", iv: decode(nonce)}, key, decode(ciphertext));
    const recipient = new TextDecoder().decode(cleartext);
    document.getElementById("recipient").textContent = recipient;
    document.getElementById("recipient").style.filter = "none";
  } catch {
    document.getElementById("recipient").textContent = "Invalid link";
    document.getElementById("recipient").style.filter = "none";
  }
}
document.getElementById("reveal-button").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  button.disabled = true;
  button.textContent = "Revealing...";
  await showAssignment();
  button.remove();
});
</script></body>
</html>
